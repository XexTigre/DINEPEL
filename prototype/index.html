const KEY='dinepel-data-hub-v2';
const clone=v=>JSON.parse(JSON.stringify(v));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
const codeKey=v=>String(v).toUpperCase().trim();
const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const badge=(s,c='')=>`<span class="badge ${c}" data-component="badge">${esc(s)}</span>`;
const uid=()=>globalThis.crypto?.randomUUID?.()??`demo-${Date.now()}-${Math.random().toString(36).slice(2)}`;
let state=clone(SEED),persistError='';
try{const saved=localStorage.getItem(KEY);if(saved){const parsed=JSON.parse(saved);validateWorkspace(parsed);state=parsed;}}catch{persistError='Não foi possível restaurar a base local. Exporte os dados ao concluir a sessão.';}
let tenant=state.companies[0].id,route='catalogo',detailId='',query='',brandFilter='',tab='todos',staged=null,toastTimer;
const navItems=[['catalogo','box','Catálogo de peças'],['empresas','building','Empresas e filiais'],['marcas','tag','Marcas'],['estoque','stock','Estoque por filial'],['importacoes','import','Importações'],['historico','history','Histórico'],['arquitetura','nodes','Como os dados se ligam']];
const company=()=>state.companies.find(c=>c.id===tenant);
const brand=id=>state.brands.find(b=>b.id===id)?.name??'Marca não encontrada';
const links=()=>state.links.filter(x=>x.company_id===tenant);
const log=(action,description)=>state.events.unshift({id:uid(),at:new Date().toISOString(),action,description,company_id:tenant});
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));persistError='';}catch{persistError='Seu navegador não permitiu salvar. Exporte uma cópia antes de fechar.';notify(persistError);}}
function notify(s){clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=s;el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,6000);}
function goto(r,id=''){route=r;detailId=id;query='';brandFilter='';render();document.getElementById('sidebar').classList.remove('open');document.getElementById('menuToggle').setAttribute('aria-expanded','false');window.scrollTo(0,0);}
function button(label,action,primary=false,ic=''){return `<button class="btn ${primary?'primary':''}" data-action="${action}" data-component="button">${ic?icon(ic):''}${esc(label)}</button>`;}
function heading(kicker,title,subtitle,actions=''){return `<div class="breadcrumb">Base de peças <span style="padding:0 8px">/</span> ${esc(kicker)}</div><div class="heading"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div><div class="flex">${actions}</div></div>`;}
function stats(data){return `<div class="cards">${data.map(([label,value,foot,ic])=>`<div class="stat" data-component="stat"><div class="flex between"><span class="label">${label}</span><div class="stat-icon">${icon(ic)}</div></div><div class="value">${value}</div><div class="foot">${foot}</div></div>`).join('')}</div>`;}
function footer(){return `<footer class="footer"><span>DINEPEL · Base técnica reutilizável por empresa.</span><span>Exemplos fictícios · Sem conexão com o ERP</span></footer>`;}
function render(){
 document.getElementById('tenantSelect').innerHTML=state.companies.map(c=>`<option value="${esc(c.id)}" ${c.id===tenant?'selected':''}>${esc(c.name)}</option>`).join('');
 document.getElementById('navigation').innerHTML=navItems.map(([id,ic,label])=>`<button data-route="${id}" class="${route===id||route==='produto'&&id==='catalogo'||route==='empresa'&&id==='empresas'?'active':''}" ${route===id?'aria-current="page"':''} data-component="nav">${icon(ic)}${label}</button>`).join('');
 const views={catalogo:catalogView,produto:productView,empresas:companiesView,empresa:companyView,marcas:brandsView,estoque:stockView,importacoes:importsView,historico:historyView,arquitetura:architectureView};
 document.getElementById('content').innerHTML=(views[route]??catalogView)()+`${persistError?`<div class="info amber">${icon('info')}${esc(persistError)}</div>`:''}`+footer();
 bind();
}
function catalogView(){
 const mine=links();const products=state.products.filter(p=>(tab!=='meus'||mine.some(l=>l.product_id===p.id))&&(!brandFilter||p.brand_id===brandFilter)&&norm(`${p.name} ${p.code} ${brand(p.brand_id)} ${p.id}`).includes(norm(query)));
 return heading('Catálogo','Catálogo de peças','Encontre uma peça já cadastrada e aproveite seus dados na empresa selecionada.',button('Nova peça','newProduct',true,'plus'))+
 stats([['Peças na base',state.products.length,'Cadastro mestre compartilhado','box'],['Marcas',state.brands.length,'Códigos separados por marca','tag'],['Nesta empresa',mine.length,esc(company().name),'link'],['Empresas',state.companies.length,'Com cadastros independentes','building']])+
 `<section class="panel"><div class="tabs"><button data-tab="todos" class="${tab==='todos'?'active':''}">Todas as peças <span class="muted">${state.products.length}</span></button><button data-tab="meus" class="${tab==='meus'?'active':''}">Vinculadas à empresa <span class="muted">${mine.length}</span></button></div><div class="toolbar"><label class="search">${icon('search')}<input id="catalogSearch" type="search" placeholder="Busque por peça, código ou marca" value="${esc(query)}" aria-label="Buscar peças"></label><select id="brandFilter" aria-label="Filtrar marca"><option value="">Todas as marcas</option>${state.brands.map(b=>`<option value="${esc(b.id)}" ${brandFilter===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>${button('Importar dados','importPage',false,'import')}</div><div class="table-wrap"><table class="catalog-table"><thead><tr><th>Peça / descrição</th><th>Marca / código fabricante</th><th>Cadastro técnico</th><th>Na empresa</th><th><span class="small">Ação</span></th></tr></thead><tbody>${products.map(p=>{const l=mine.find(x=>x.product_id===p.id);return `<tr><td><div class="product-cell"><div class="part-tile">${icon('box')}</div><div><button class="link" data-product="${esc(p.id)}">${esc(p.name)}</button><p class="muted mono">${esc(p.id.slice(0,18))} · ${esc(p.unit)}</p></div></div></td><td><strong>${esc(brand(p.brand_id))}</strong><p class="muted mono">${esc(p.code)}</p></td><td>${badge(p.status==='revisado'?'Exemplo revisado':'Revisão pendente',p.status==='revisado'?'green':'amber')}</td><td>${l?`<span class="mono">${esc(l.internal_code)}</span>`:`<span class="muted">Ainda sem vínculo</span>`}</td><td><button class="btn small ${l?'':'soft'}" data-${l?'product':'link-product'}="${esc(p.id)}">${l?'Abrir ficha':'Vincular'} ${icon(l?'arrow':'plus')}</button></td></tr>`}).join('')||`<tr><td colspan="5"><div class="empty"><h3>Nenhuma peça encontrada</h3><p>Tente outro código ou cadastre uma nova peça.</p></div></td></tr>`}</tbody></table></div><div class="panel-foot"><span>${products.length} peças exibidas · ${state.products.length} na base</span><span>Dados de demonstração</span></div></section><div class="info">${icon('link')}<div><strong>Uma peça, vários cadastros.</strong> Marca + código do fabricante identificam o produto. Cada empresa mantém seu próprio código interno e estoque.</div></div>`;
}
function productView(){const p=state.products.find(x=>x.id===detailId);if(!p)return heading('Peça','Peça não encontrada','Volte ao catálogo.',button('Voltar','catalogPage'));const l=links().find(x=>x.product_id===p.id);return heading('Ficha da peça','Ficha da peça','Dados técnicos reutilizáveis e vínculos separados por empresa.',button('Voltar ao catálogo','catalogPage'))+`<div class="details-title"><div class="part-tile">${icon('box')}</div><div><p class="upper red">${esc(brand(p.brand_id))} / ${esc(p.code)}</p><h1>${esc(p.name)}</h1><p class="small muted">ID estável: ${esc(p.id)}</p></div></div><div class="two-col"><div class="stack"><section class="panel"><div class="panel-head"><h2>Identificação e dados técnicos</h2>${badge('Demonstração','amber')}</div><div class="panel-body"><dl class="data-grid"><div><dt>Marca</dt><dd>${esc(brand(p.brand_id))}</dd></div><div><dt>Código do fabricante</dt><dd class="mono">${esc(p.code)}</dd></div><div><dt>Unidade</dt><dd>${esc(p.unit)}</dd></div><div><dt>Origem</dt><dd>${esc(p.source)}</dd></div><div><dt>Aplicações</dt><dd>Não validadas neste exemplo</dd></div><div><dt>OEM / similares</dt><dd>Exigem evidência técnica</dd></div></dl><div class="info amber">${icon('info')}Exemplo visual. A peça não deve ser usada como referência técnica real.</div></div></section><section class="panel"><div class="panel-head"><h2>Vínculo na empresa selecionada</h2>${badge(company().name)}</div><div class="panel-body">${l?`<dl class="data-grid"><div><dt>Código interno</dt><dd class="mono">${esc(l.internal_code)}</dd></div><div><dt>Sistema de origem</dt><dd>${esc(l.namespace)}</dd></div></dl><p class="note" style="margin-top:20px">Os saldos ficam associados às filiais desta empresa.</p>`:`<p class="muted" style="margin-bottom:18px">Esta peça ainda não está na base de ${esc(company().name)}.</p><button class="btn primary" data-link-product="${esc(p.id)}">${icon('link')}Vincular à empresa</button>`}</div></section></div><div class="stack"><div class="callout"><h2>Reaproveitar com segurança</h2><p>O vínculo usa o mesmo produto mestre. Código interno, custo, preço e saldo pertencem à empresa que o utiliza.</p>${button('Ver estoque da empresa','stockPage',false,'arrow')}</div><section class="panel"><div class="panel-head"><h2>Trilha da informação</h2></div><div class="panel-body"><div class="timeline"><article><h3>Origem preservada</h3><p>${esc(p.source)}</p></article><article><h3>Identidade estável</h3><p>A marca e o código continuam separados do código interno de cada empresa.</p></article><article><h3>Revisão técnica</h3><p>Aplicações, medidas e referências precisam de fonte.</p></article></div></div></section></div></div>`;}
function companiesView(){return heading('Empresas','Empresas e filiais','Reutilize a base técnica mantendo os dados de cada empresa no seu lugar.',button('Nova empresa','newCompany',true,'plus'))+`<div class="three-col">${state.companies.map(c=>`<section class="panel company-card"><div class="company-icon">${icon('building')}</div><h2>${esc(c.name)}</h2><p>${c.cnpj?esc(c.cnpj):'CNPJ não informado · exemplo fictício'}</p><div class="company-metrics"><span><strong>${state.branches.filter(b=>b.company_id===c.id).length}</strong> filiais</span><span><strong>${state.links.filter(l=>l.company_id===c.id).length}</strong> peças vinculadas</span></div><button class="link" style="margin-top:18px" data-company="${esc(c.id)}">Abrir empresa ${icon('arrow')}</button></section>`).join('')}</div><div class="info">${icon('info')}CNPJ é tratado como texto: números e letras são preservados. A condição de matriz ou filial é cadastrada explicitamente.</div>`;}
function companyView(){const c=state.companies.find(x=>x.id===detailId)||company();return heading('Empresa',c.name,'Um cadastro de empresa, suas filiais e os produtos que ela utiliza.',button('Todas as empresas','companiesPage'))+`<div class="two-col"><section class="panel"><div class="panel-head"><h2>Filiais desta empresa</h2>${badge('Vínculo explícito')}</div><div class="table-wrap"><table><thead><tr><th>Estabelecimento</th><th>Tipo</th><th>Identificador</th></tr></thead><tbody>${state.branches.filter(b=>b.company_id===c.id).map(b=>`<tr><td><strong>${esc(b.name)}</strong></td><td>${badge(b.type)}</td><td class="mono">${esc(b.id)}</td></tr>`).join('')||'<tr><td colspan="3">Nenhuma filial cadastrada.</td></tr>'}</tbody></table></div></section><section class="panel"><div class="panel-head"><h2>Ficha da empresa</h2></div><div class="panel-body stack"><div><p class="muted small">Identificador estável</p><p class="mono">${esc(c.id)}</p></div><div><p class="muted small">CNPJ</p><p>${esc(c.cnpj||'Não informado')}</p></div><div><p class="muted small">Base técnica</p><p>Compartilhada por vínculos</p></div><button class="btn primary" data-select-company="${esc(c.id)}">Consultar esta empresa ${icon('arrow')}</button></div></section></div>`;}
function brandsView(){return heading('Marcas','Marcas e identidade','O mesmo código pode existir em marcas diferentes. Cada combinação permanece única.',button('Nova marca','newBrand',true,'plus'))+`<section class="panel"><div class="panel-head"><h2>Marcas da base</h2>${badge(`${state.brands.length} registros`)}</div><div class="table-wrap"><table><thead><tr><th>Marca</th><th>Identificador</th><th>Peças na base</th><th>Consulta</th></tr></thead><tbody>${state.brands.map(b=>`<tr><td><strong>${esc(b.name)}</strong></td><td class="mono">${esc(b.id)}</td><td>${state.products.filter(p=>p.brand_id===b.id).length}</td><td><button class="link" data-brand="${esc(b.id)}">Ver peças ${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div></section><div class="info amber">${icon('info')}No exemplo, as marcas Alfa e Beta usam PL-100. São produtos separados; coincidência de código não comprova equivalência.</div>`;}
function stockView(){const branches=state.branches.filter(b=>b.company_id===tenant),mine=links();return heading('Estoque','Estoque por filial','Consulte saldos de origem sem misturar empresas ou corrigir quantidades por suposição.',button('Exportar base local','export',false,'import'))+`<section class="panel"><div class="panel-head"><div><h2>${esc(company().name)}</h2><p class="small muted">Snapshots fictícios · não representam disponibilidade real</p></div>${badge('Somente consulta')}</div><div class="stock-hint">Saldo negativo deve gerar conferência física. A tela mantém o valor recebido.</div><div class="table-wrap"><table><thead><tr><th>Peça / código interno</th>${branches.map(b=>`<th>${esc(b.name)}</th>`).join('')}</tr></thead><tbody>${mine.map(l=>{const p=state.products.find(p=>p.id===l.product_id);return `<tr><td><button class="link" data-product="${esc(p.id)}">${esc(p.name)}</button><p class="muted mono">${esc(l.internal_code)}</p></td>${branches.map(b=>{const s=state.stock.find(s=>s.link_id===l.id&&s.branch_id===b.id);return `<td class="${s&&s.quantity<0?'negative':''}">${s?`${esc(s.quantity)} ${esc(p.unit)}${s.quantity<0?' · Conferir':''}`:'Sem snapshot'}</td>`}).join('')}</tr>`}).join('')||`<tr><td colspan="${branches.length+1}"><div class="empty">Nenhuma peça vinculada a esta empresa.</div></td></tr>`}</tbody></table></div></section><div class="info amber">${icon('info')}O módulo de compras ainda depende dos gates, logs e fórmula aprovados no repositório. Esta prévia não calcula recomendações.</div>`;}
function importsView(){return heading('Importações','Importar dados','Confira o lote antes de aplicar. Conflitos nunca substituem um cadastro silenciosamente.',button('Exportar base local','export',false,'import'))+`<div class="two-col"><div class="stack"><section class="panel"><div class="panel-head"><div class="flex"><span class="step-number">1</span><h2>Consultar um catálogo no GitHub</h2></div>${badge('Leitura pública')}</div><div class="panel-body"><p class="small muted" style="margin-bottom:18px">A prévia consulta o exemplo público de XexTigre/DINEPEL e registra o commit exato.</p><div class="flex between"><span class="mono small" style="overflow-wrap:anywhere">examples/catalogo-demo.json</span>${button('Consultar GitHub','github',true,'import')}</div><label class="file-zone">Ou selecione um catálogo JSON local<input type="file" id="jsonFile" accept="application/json,.json"><span class="note" style="display:block;margin-top:10px">Também aceita o backup da base local, com restauração confirmada.</span></label></div></section><section class="panel"><div class="panel-head"><div class="flex"><span class="step-number">2</span><h2>Revisar e aplicar</h2></div></div><div class="panel-body">${staged?`<p class="small muted" style="overflow-wrap:anywhere">Origem: ${esc(staged.source)}</p><p style="margin:16px 0">${staged.newCount} novos registros · ${staged.sameCount} já existentes · ${staged.conflicts.length} conflitos</p>${staged.conflicts.length?`<div class="info red">${icon('info')}Lote bloqueado: ${esc(staged.conflicts.join('; '))}</div>`:button(staged.kind==='workspace'?'Confirmar restauração da base':'Aplicar lote validado','applyImport',true,'check')}`:`<p class="muted small">Consulte o GitHub ou selecione um arquivo para conferir identidade, marcas, unidades e duplicidades.</p>`}</div></section></div><div class="stack"><div class="callout"><h2>Seu catálogo continua com você.</h2><p>Os dados técnicos podem ser reaproveitados em futuros cadastros. O histórico registra de onde vieram e o que mudou.</p>${button('Ver histórico','historyPage',false,'arrow')}</div><section class="panel"><div class="panel-head"><h2>Antes de aplicar</h2></div><div class="panel-body"><ul class="checklist">${['Schema e versão reconhecidos','Marca + código sem colisão','IDs e unidades consistentes','Origem registrada no histórico','Nenhum dado existente sobrescrito'].map(s=>`<li>${icon('check')}${s}</li>`).join('')}</ul></div></section><p class="note">Prévia: salvamento neste navegador. Exporte backups. A versão multiusuário precisa de API, autenticação e banco.</p></div></div>`;}
function historyView(){const events=state.events.filter(e=>!e.company_id||e.company_id===tenant);return heading('Histórico','Histórico dos cadastros','Consulte a origem e as decisões registradas para a empresa selecionada.',button('Exportar base local','export',false,'import'))+`<section class="panel"><div class="panel-head"><h2>Atividades da base</h2>${badge('Histórico demonstrativo')}</div><div class="panel-body"><div class="timeline">${events.map(e=>`<article><div class="flex between"><h3>${esc(e.action)}</h3><span class="small muted">${esc(new Date(e.at).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}))}</span></div><p style="overflow-wrap:anywhere">${esc(e.description)}</p></article>`).join('')||'<p class="muted">Nenhuma atividade nesta empresa.</p>'}</div></div></section><div class="info">${icon('info')}No servidor, as alterações precisam de autor autenticado, versão anterior, versão posterior e transação. O histórico local é editável pelo próprio navegador.</div>`;}
function architectureView(){return heading('Estrutura','Tudo ligado, sem misturar.','O catálogo é reutilizável. Operação e estoque pertencem a cada empresa.')+`<section class="panel"><div class="panel-head"><h2>Do arquivo à consulta</h2>${badge('Arquitetura proposta')}</div><div class="panel-body"><div class="flow"><div class="flow-node"><span>01 / ORIGEM</span><h3>GitHub ou arquivo</h3><p>Catálogos públicos de demonstração, versões e schemas. Dados privados ficam fora do repositório público.</p></div><div class="flow-node"><span>02 / ENTRADA</span><h3>Importação com revisão</h3><p>Valida identidade, unidades, versão e duplicidades. Lotes repetidos não multiplicam registros.</p></div><div class="flow-node"><span>03 / PERSISTÊNCIA</span><h3>API + PostgreSQL</h3><p>Cadastro mestre, vínculos por empresa, permissões e histórico gravados em transações.</p></div><div class="flow-node"><span>04 / USO</span><h3>App de consulta e cadastro</h3><p>Buscar → reutilizar produto → vincular empresa → consultar o estoque de suas filiais.</p></div></div><div class="domain-graph"><article><h3>Marca → Peça</h3><p>Chave estável e código do fabricante. OEM, medidas e aplicações dependem de fontes e evidências.</p></article><article><h3>Empresa → Vínculo</h3><p>Código interno, sistema de origem e dados comerciais próprios.</p></article><article><h3>Filial → Snapshot</h3><p>Vínculo + filial + instante. O saldo original permanece recuperável.</p></article></div><div class="info">${icon('link')}Uma empresa nova poderá aproveitar a ficha técnica existente. Um novo vínculo preserva os dados operacionais das outras empresas.</div></div></section>`;}
function bind(){
 document.querySelectorAll('[data-route]').forEach(e=>e.onclick=()=>goto(e.dataset.route));
 document.querySelectorAll('[data-product]').forEach(e=>e.onclick=()=>goto('produto',e.dataset.product));
 document.querySelectorAll('[data-company]').forEach(e=>e.onclick=()=>goto('empresa',e.dataset.company));
 document.querySelectorAll('[data-select-company]').forEach(e=>e.onclick=()=>{tenant=e.dataset.selectCompany;goto('catalogo');});
 document.querySelectorAll('[data-link-product]').forEach(e=>e.onclick=()=>linkDialog(e.dataset.linkProduct));
 document.querySelectorAll('[data-brand]').forEach(e=>e.onclick=()=>{route='catalogo';tab='todos';brandFilter=e.dataset.brand;render();});
 document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{tab=e.dataset.tab;render();});
 document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>action(e.dataset.action,e));
 const search=document.getElementById('catalogSearch');if(search)search.oninput=()=>{const pos=search.selectionStart;query=search.value;render();const n=document.getElementById('catalogSearch');n.focus();n.setSelectionRange?.(pos,pos);};
 const filter=document.getElementById('brandFilter');if(filter)filter.onchange=()=>{brandFilter=filter.value;render();};
 const file=document.getElementById('jsonFile');if(file)file.onchange=async()=>{staged=null;try{const f=file.files[0];if(!f)return;if(f.size>2_000_000)throw Error('Limite da prévia: 2 MB.');const data=JSON.parse(await f.text());stage(data,`Arquivo local: ${f.name}`);render();}catch(e){render();notify(`Importação recusada: ${e.message}`);}};
}
const dialog=document.getElementById('dialog');
function modal(title,subtitle,fields,submitLabel,handler){document.getElementById('dialogContent').innerHTML=`<div class="dialog-head flex between"><div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><button id="closeDialog" aria-label="Fechar">${icon('close')}</button></div><form id="form">${fields}<div id="formError" class="form-error" role="alert" hidden></div><div class="flex" style="justify-content:flex-end"><button type="button" class="btn" id="cancelDialog">Cancelar</button><button type="submit" class="btn primary">${esc(submitLabel)}</button></div></form>`;document.getElementById('closeDialog').onclick=()=>dialog.close();document.getElementById('cancelDialog').onclick=()=>dialog.close();document.getElementById('form').onsubmit=e=>{e.preventDefault();const err=document.getElementById('formError');err.hidden=true;try{handler(new FormData(e.target));}catch(ex){err.textContent=ex.message;err.hidden=false;}};dialog.showModal();}
function field(label,name,placeholder='',required=true,value=''){return `<label class="field">${label}<input name="${name}" placeholder="${placeholder}" ${required?'required':''} maxlength="150" value="${esc(value)}"></label>`;}
function productDialog(){modal('Nova peça','A marca e o código identificam a peça nesta base.',`${field('Descrição da peça','name','Ex.: Suporte do conjunto')}<div class="form-row"><label class="field">Marca<select name="brand_id">${state.brands.map(b=>`<option value="${esc(b.id)}">${esc(b.name)}</option>`).join('')}</select></label>${field('Código do fabricante','code','Ex.: PL-200')}</div><label class="field">Unidade<select name="unit"><option>UN</option><option>PC</option><option>KT</option></select></label><p class="note">Aplicações e referências técnicas ficam pendentes até validação por fonte.</p>`,'Salvar peça',f=>{const name=f.get('name').trim(),code=f.get('code').trim(),bid=f.get('brand_id');if(!name||!code)throw Error('Informe descrição e código.');const found=state.products.find(p=>p.brand_id===bid&&codeKey(p.code)===codeKey(code));if(found){throw Error(`Peça já cadastrada: ${found.name}. Cancele e use a ficha existente para vincular à empresa.`);}const p={id:uid(),brand_id:bid,code,name,unit:f.get('unit'),status:'pendente',source:'Cadastro manual na prévia'};state.products.push(p);log('Peça cadastrada',`${brand(bid)} / ${code} · aguardando revisão técnica`);save();dialog.close();goto('produto',p.id);notify('Peça salva na base local.');});}
function linkDialog(id){const p=state.products.find(p=>p.id===id);if(!p)return;modal('Vincular peça à empresa',`${p.name} · ${company().name}`,`${field('Código interno da empresa','internal_code','Ex.: LOJA-001')}${field('Sistema de origem / namespace','namespace','Ex.: SysPro',true,'Cadastro local')}<p class="note">O vínculo reutiliza a ficha técnica e mantém o cadastro comercial nesta empresa.</p>`,'Criar vínculo',f=>{if(links().some(l=>l.product_id===id))throw Error('Esta peça já está vinculada à empresa.');const code=f.get('internal_code').trim(),ns=f.get('namespace').trim();if(!code||!ns)throw Error('Informe código e sistema de origem.');if(links().some(l=>norm(l.internal_code)===norm(code)&&norm(l.namespace)===norm(ns)))throw Error('Este código já está em uso no mesmo sistema de origem da empresa.');state.links.push({id:uid(),company_id:tenant,product_id:id,internal_code:code,namespace:ns});log('Vínculo criado',`${brand(p.brand_id)} / ${p.code} → ${company().name}, código ${code}`);save();dialog.close();render();notify('Peça vinculada. Outros cadastros foram preservados.');});}
function normalizeCnpj(v){const c=String(v).toUpperCase().replace(/[.\/\-\s]/g,'');if(!/^[A-Z0-9]{12}[0-9]{2}$/.test(c)||/^(.)\1{13}$/.test(c))throw Error('CNPJ inválido. Use 14 posições, com os dois verificadores numéricos.');let base=c.slice(0,12);for(const weights of [[5,4,3,2,9,8,7,6,5,4,3,2],[6,5,4,3,2,9,8,7,6,5,4,3,2]]){const sum=[...base].reduce((s,x,i)=>s+(x.charCodeAt(0)-48)*weights[i],0),r=sum%11;base+=String(r<2?0:11-r);}if(base!==c)throw Error('Dígitos verificadores do CNPJ inválidos.');return c;}
function companyDialog(){modal('Nova empresa','A empresa reaproveita o catálogo e mantém vínculos próprios.',`${field('Nome da empresa','name','Nome para consulta')}${field('CNPJ (opcional na demonstração)','cnpj','Numérico ou alfanumérico',false)}${field('Primeiro estabelecimento','branch','Ex.: Unidade principal')}`,'Salvar empresa',f=>{const name=f.get('name').trim(),branchName=f.get('branch').trim(),raw=f.get('cnpj').trim(),cnpj=raw?normalizeCnpj(raw):'';if(!name||!branchName)throw Error('Preencha os nomes.');if(cnpj&&state.companies.some(c=>c.cnpj===cnpj))throw Error('CNPJ já cadastrado. Reutilize a empresa existente.');const id=uid();state.companies.push({id,name,cnpj});state.branches.push({id:uid(),company_id:id,name:branchName,type:'Matriz informada'});tenant=id;log('Empresa cadastrada',name);save();dialog.close();goto('empresa',id);notify('Empresa salva na base local.');});}
function brandDialog(){modal('Nova marca','Códigos iguais de marcas diferentes ficam separados.',field('Nome da marca','name','Nome da marca'),'Salvar marca',f=>{const name=f.get('name').trim();if(!name)throw Error('Informe o nome.');if(state.brands.some(b=>norm(b.name)===norm(name)))throw Error('Marca já cadastrada. Reutilize a existente.');state.brands.push({id:uid(),name});log('Marca cadastrada',name);save();dialog.close();render();notify('Marca salva.');});}
function validateCatalog(data){const only=(v,keys)=>{if(Object.keys(v).some(k=>!keys.includes(k)))throw Error('Campo não previsto no contrato.');};if(data&&typeof data==='object')only(data,['schema_version','kind','synthetic','brands','products']);if(!data||typeof data.synthetic!=='boolean'||data.schema_version!==1||data.kind!=='catalogo'||!Array.isArray(data.brands)||!Array.isArray(data.products))throw Error('Use o contrato catalogo, schema_version 1.');if(data.products.length>5000||data.brands.length>1000)throw Error('Lote acima do limite da prévia.');const brandIds=new Set(),brandNames=new Set(),productIds=new Set(),keys=new Set();for(const b of data.brands){if(!b||typeof b!=='object')throw Error('Marca inválida.');only(b,['id','name']);if(typeof b.id!=='string'||!b.id.trim()||typeof b.name!=='string'||!b.name.trim())throw Error('Marca sem ID ou nome.');if(brandIds.has(b.id)||brandNames.has(norm(b.name)))throw Error('Marca repetida no lote.');brandIds.add(b.id);brandNames.add(norm(b.name));}for(const p of data.products){if(p&&typeof p==='object')only(p,['id','brand_id','code','name','unit','status','source']);if(!p||['id','brand_id','code','name','unit','status','source'].some(k=>typeof p[k]!=='string'||!p[k].trim()))throw Error('Peça com campo obrigatório ausente.');if(!brandIds.has(p.brand_id))throw Error('Marca da peça não existe no lote.');if(!['UN','PC','KT'].includes(p.unit))throw Error('Unidade não reconhecida.');if(!['pendente','revisado'].includes(p.status))throw Error('Status não reconhecido.');const key=`${p.brand_id}::${codeKey(p.code)}`;if(productIds.has(p.id)||keys.has(key))throw Error('ID ou marca + código duplicado no lote.');productIds.add(p.id);keys.add(key);}}
function validateWorkspace(data){if(!data||data.kind!=='workspace'||data.schema_version!==1)throw Error('Backup não reconhecido.');validateCatalog({schema_version:data.schema_version,kind:'catalogo',synthetic:data.synthetic,brands:data.brands,products:data.products});for(const k of ['companies','branches','links','stock','events'])if(!Array.isArray(data[k]))throw Error(`Backup sem ${k}.`);const unique=(arr,name)=>{const ids=new Set();for(const x of arr){if(!x||typeof x.id!=='string'||!x.id||ids.has(x.id))throw Error(`${name}: ID inválido.`);ids.add(x.id);}return ids;};const cs=unique(data.companies,'Empresas'),bs=unique(data.branches,'Filiais'),ls=unique(data.links,'Vínculos');unique(data.stock,'Snapshots');unique(data.events,'Histórico');if(!cs.size)throw Error('Backup sem empresa.');for(const c of data.companies)if(typeof c.name!=='string'||!c.name.trim()||typeof c.cnpj!=='string')throw Error('Empresa inválida.');for(const b of data.branches)if(!cs.has(b.company_id)||typeof b.name!=='string'||typeof b.type!=='string')throw Error('Filial inválida.');const ns=new Set(),linked=new Set();for(const l of data.links){if(!cs.has(l.company_id)||!data.products.some(p=>p.id===l.product_id)||typeof l.namespace!=='string'||!l.namespace.trim()||typeof l.internal_code!=='string'||!l.internal_code.trim())throw Error('Vínculo inválido.');const key=[l.company_id,norm(l.namespace),norm(l.internal_code)].join('::'),lk=[l.company_id,l.product_id].join('::');if(ns.has(key)||linked.has(lk))throw Error('Vínculo duplicado.');ns.add(key);linked.add(lk);}for(const s of data.stock){const l=data.links.find(l=>l.id===s.link_id),b=data.branches.find(b=>b.id===s.branch_id);if(!l||!b||l.company_id!==b.company_id||!Number.isFinite(s.quantity)||typeof s.at!=='string'||Number.isNaN(Date.parse(s.at)))throw Error('Snapshot inválido ou de outra empresa.');}for(const e of data.events)if(typeof e.at!=='string'||Number.isNaN(Date.parse(e.at))||typeof e.action!=='string'||typeof e.description!=='string'||(e.company_id&&!cs.has(e.company_id)))throw Error('Evento inválido.');}
function stage(data,source){if(data?.kind==='workspace'){validateWorkspace(data);staged={kind:'workspace',data,source,newCount:data.products.length,sameCount:0,conflicts:[]};return;}validateCatalog(data);const conflicts=[];let newCount=0,sameCount=0;for(const b of data.brands){const same=state.brands.find(x=>x.id===b.id),named=state.brands.find(x=>norm(x.name)===norm(b.name));if((same&&same.name!==b.name)||(named&&named.id!==b.id))conflicts.push(`Marca ${b.name}: identidade divergente`);}for(const p of data.products){const same=state.products.find(x=>x.id===p.id),key=state.products.find(x=>x.brand_id===p.brand_id&&codeKey(x.code)===codeKey(p.code));if(same&&['brand_id','code','name','unit','status','source'].some(k=>same[k]!==p[k]))conflicts.push(`Peça ${p.code}: conteúdo divergente`);else if(key&&key.id!==p.id)conflicts.push(`Peça ${p.code}: identidade duplicada`);else if(same)sameCount++;else newCount++;}staged={kind:'catalogo',data,source,newCount,sameCount,conflicts};}
async function githubImport(el){staged=null;el.disabled=true;try{const options={headers:{Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)},resp=await fetch('https://api.github.com/repos/XexTigre/DINEPEL/commits/main',options);if(!resp.ok)throw Error(`GitHub respondeu HTTP ${resp.status}`);const commit=await resp.json();if(!/^[a-f0-9]{40}$/.test(commit.sha))throw Error('Commit inválido.');const dataResp=await fetch(`https://raw.githubusercontent.com/XexTigre/DINEPEL/${commit.sha}/examples/catalogo-demo.json`,{signal:AbortSignal.timeout(15000)});if(!dataResp.ok)throw Error(`Catálogo indisponível: HTTP ${dataResp.status}`);const raw=await dataResp.text();if(raw.length>2_000_000)throw Error('Catálogo acima do limite da prévia.');stage(JSON.parse(raw),`GitHub XexTigre/DINEPEL · commit ${commit.sha} · examples/catalogo-demo.json`);render();notify('Lote consultado. Confira antes de aplicar.');}catch(e){render();notify(`Consulta não concluída: ${e.message}`);}finally{el.disabled=false;}}
function applyImport(){if(!staged||staged.conflicts.length)return;const batch=staged;if(batch.kind==='workspace'){state=clone(batch.data);tenant=state.companies[0].id;log('Backup restaurado',batch.source);}else{for(const b of batch.data.brands)if(!state.brands.some(x=>x.id===b.id))state.brands.push(clone(b));for(const p of batch.data.products)if(!state.products.some(x=>x.id===p.id))state.products.push(clone(p));log('Lote de catálogo aplicado',`${batch.newCount} novas peças, ${batch.sameCount} já existentes. ${batch.source}`);}save();staged=null;render();notify(batch.kind==='workspace'?'Backup restaurado.':'Lote aplicado sem sobrescrever os cadastros.');}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dinepel-base-local.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Cópia JSON preparada para download.');}
function action(a,el){({newProduct:productDialog,newCompany:companyDialog,newBrand:brandDialog,catalogPage:()=>goto('catalogo'),companiesPage:()=>goto('empresas'),importPage:()=>goto('importacoes'),historyPage:()=>goto('historico'),stockPage:()=>goto('estoque'),github:()=>githubImport(el),applyImport,export:exportData}[a]||(()=>{}))();}
document.getElementById('tenantSelect').onchange=e=>{tenant=e.target.value;render();};
document.getElementById('menuToggle').onclick=()=>{const open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('menuToggle').setAttribute('aria-expanded',String(open));};
window.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('sidebar').classList.remove('open');document.getElementById('menuToggle').setAttribute('aria-expanded','false');}});
render();
</script>
